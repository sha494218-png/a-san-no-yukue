/* ============================================================
 * エンジン — 描画・答え合わせ・進捗保存
 * ここから下はシナリオ内容を書かない(CONFIGに全て出す)
 * ============================================================ */
(function () {
  const STORAGE_KEY = "aescape_progress_v1";
  const WRONG_RESCUE_THRESHOLD = 5;
  // 手がかりの種類ラベル(6種)。未指定/未知の値は"doc"扱いにする。
  const KIND_LABEL = { person: "人物", place: "場所", photo: "写真", diary: "日記", doc: "資料", map: "地図" };

  /* ---------- DOMヘルパー ---------- */
  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (attrs[k] === undefined) continue; // undefinedは属性を付けない(例: selected/patternの条件付き指定)
        if (k === "class") node.className = attrs[k];
        else if (k === "html") node.innerHTML = attrs[k];
        else if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
        else node.setAttribute(k, attrs[k]);
      }
    }
    (children || []).forEach((c) => {
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }
  const $app = document.getElementById("app");
  const $dest = document.getElementById("dest-value");

  /* ---------- 答えの正規化 ----------
   * 全角→半角・カタカナ→ひらがな・大小文字・空白/記号/長音を吸収する。
   * ００００=0000 / ｌｉｏｎ=LION / コ タ エ=こたえ が全て一致する。
   * この寛容さは絶対に削らないこと(スタッフの手入力ミスも救うための仕様)。
   */
  function norm(s) {
    if (s == null) return "";
    let v = String(s).normalize("NFKC").toLowerCase();
    v = v.replace(/[ァ-ヶ]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0x60)); // カタカナ→ひらがな
    v = v.replace(/[ー\-‐−–—]/g, ""); // 長音・各種ハイフンを除去
    v = v.replace(/[^\p{L}\p{N}]/gu, ""); // 残りの空白・記号を除去
    return v;
  }
  function matchAny(input, answers) {
    const n = norm(input);
    if (!n) return false;
    return answers.some((a) => norm(a) === n);
  }

  /* ---------- 進捗の永続化(localStorage、ダメならメモリにフォールバック) ---------- */
  const memoryFallback = {};
  const hasStorage = (() => {
    try {
      const t = "__t__";
      localStorage.setItem(t, "1");
      localStorage.removeItem(t);
      return true;
    } catch (e) {
      return false;
    }
  })();

  function defaultState() {
    return {
      sceneId: CONFIG.scenes[0].id,
      solved: {},
      clues: [],
      hintsOpened: {},
      wrongCount: {},
      truth: false,
      branchChoice: null, // 'NO17CODE' / 'LIONCODE' / 'pass'
      startedAt: null,
      finishedAt: null,
      solvedCount: 0,
      storyLog: [], // 通過した物語(story)シーンのidを順番に記録し、「物語を振り返る」で一覧表示する
    };
  }

  const store = {
    load() {
      try {
        const raw = hasStorage ? localStorage.getItem(STORAGE_KEY) : memoryFallback.data;
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        // 古い保存データにkindが無い手がかりは、KEYを上げて進捗を捨てるのではなく"doc"を補って読み込む
        if (Array.isArray(parsed.clues)) {
          parsed.clues.forEach((c) => {
            if (!c.kind) c.kind = "doc";
          });
        }
        return Object.assign(defaultState(), parsed);
      } catch (e) {
        return defaultState();
      }
    },
    save(state) {
      const raw = JSON.stringify(state);
      try {
        if (hasStorage) localStorage.setItem(STORAGE_KEY, raw);
        else memoryFallback.data = raw;
      } catch (e) {
        memoryFallback.data = raw;
      }
    },
    reset() {
      try {
        if (hasStorage) localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      memoryFallback.data = null;
    },
  };

  let state = store.load();
  function persist() {
    store.save(state);
  }

  const sceneMap = {};
  CONFIG.scenes.forEach((s) => (sceneMap[s.id] = s));
  function scene(id) {
    return sceneMap[id];
  }

  /* ---------- 画面切り替え ----------
   * ブラウザ(スマホ)の「戻る」操作でひとつ前のシーンに戻れるよう、
   * シーンを進めるたびに History API へ積んでおく。戻る操作は popstate で拾う。
   */
  function goto(id) {
    if (!sceneMap[id]) {
      console.error("未定義のシーンIDです:", id);
      return;
    }
    state.sceneId = id;
    persist();
    try {
      history.pushState({ sceneId: id }, "", location.pathname + location.search + location.hash);
    } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }

  // 手がかり一覧・物語振り返り・画像の拡大表示(ライトボックス)を開くたびに、
  // 履歴を1つ積んでおく。こうすることで、それらを開いた状態でスマホの「戻る」を
  // 押しても場面そのものは動かず、開いていたものを閉じるだけで済む。
  function pushOverlayHistory() {
    try {
      history.pushState({ sceneId: state.sceneId, overlay: true }, "", location.pathname + location.search + location.hash);
    } catch (e) {}
  }

  window.addEventListener("popstate", (e) => {
    // 手がかり一覧などのシート、画像拡大表示が開いていれば、「戻る」はまずそれを閉じるだけに使う
    if (sheetEls || lb) {
      closeSheetIfOpen();
      closeLightbox();
      return;
    }
    const sceneId = e.state && e.state.sceneId;
    if (!sceneId || !sceneMap[sceneId]) return; // 合言葉ページ(#staff)のハッシュ由来のpopstateなどは無視
    state.sceneId = sceneId;
    persist();
    render();
    window.scrollTo(0, 0);
  });

  // reward は単一オブジェクトのほか、1つの謎で複数の手がかりを得る場合(謎1など)は配列でも渡せる
  function addClue(reward, fromLabel) {
    if (!reward) return;
    const list = Array.isArray(reward) ? reward : [reward];
    list.forEach((r) => {
      state.clues.push({
        label: r.label,
        detail: r.detail || "",
        font: r.font || null,
        kind: r.kind || "doc", // 種類未指定はdocとして扱う
        image: r.image || null,
        from: fromLabel,
      });
    });
  }

  function markSolved(sceneId) {
    if (!state.solved[sceneId]) {
      state.solved[sceneId] = true;
      state.solvedCount = (state.solvedCount || 0) + 1;
    }
  }

  /* ---------- 地図の訪問軌跡 ----------
   * 表示するのは「すでに訪問した／すでに解いた場所だけ」。未訪問の目的地は一切出さない。
   * LION謎の分岐(ライオン/NO17)は、選ばなかった方を絶対に出してはいけない
   * (分岐の存在自体がネタバレになるため)。
   */
  function getVisitedGridCells() {
    const cells = new Set();
    for (const sceneId in SCENE_GRID_CELL) {
      const cell = SCENE_GRID_CELL[sceneId];
      if (cell != null && state.solved[sceneId]) cells.add(cell);
    }
    if (state.branchChoice === "NO17CODE") cells.add(BRANCH_GRID_CELL.NO17CODE);
    else if (state.branchChoice === "LIONCODE") cells.add(BRANCH_GRID_CELL.LIONCODE);
    // branchChoiceが"pass"またはnullのときは、まだどちらにも実際に足を運んでいないので何も追加しない
    return [...cells];
  }

  /* ---------- 目的地バーの更新 ---------- */
  function updateDestBar() {
    const s = scene(state.sceneId);
    let label = "—";
    if (s && s.type !== "title") { // タイトル画面では先の目的地を出さない
      if (s.destination) label = s.destination;
      else if (s.type === "move" || s.type === "code") label = s.destination || "—";
      else {
        // 未来のシーンをたどって直近の目的地を探す(現在地に指定が無い場合)
        let cur = s;
        let guard = 0;
        while (cur && guard < 20) {
          if (cur.destination) {
            label = cur.destination;
            break;
          }
          const nid = cur.next || cur.nextTrue;
          cur = nid ? scene(nid) : null;
          guard++;
        }
      }
    }
    $dest.textContent = label;
  }

  /* ---------- 下部バーの表示切り替え ---------- */
  const $btnHint = document.getElementById("btn-hint");
  const $btnMap = document.getElementById("btn-map");
  const $btnStory = document.getElementById("btn-story");
  const $btnStaff = document.getElementById("btn-staff");
  function updateBottomBar() {
    const s = scene(state.sceneId);
    const isPuzzleLike = s && (s.type === "puzzle" || s.type === "final") && s.hints && s.hints.length;
    $btnHint.classList.toggle("hidden", !isPuzzleLike);
    // 謎1(パソコンのパスワード)を解いて地図を入手した後は、いつでも「地図」ボタンから見返せる
    $btnMap.classList.toggle("hidden", CONFIG.showMapButton === false || !state.solved["puzzle_pc"]);
    // 物語(story)シーンをひとつでも通過していれば、いつでも読み返せる
    $btnStory.classList.toggle("hidden", state.storyLog.length === 0);
    $btnStaff.classList.toggle("hidden", location.hash !== "#staff");
  }
  $btnMap.addEventListener("click", () => openLightbox(CONFIG.mapImage, "地図"));
  $btnStory.addEventListener("click", openStorySheet);

  /* ============================================================
   * シーン描画
   * ============================================================ */
  function render() {
    const s = scene(state.sceneId);
    document.body.className = "scene-" + s.type;
    // QRコードの関門などで「その段階まで来たか」を判定するため、表示したシーンを記録しておく
    state.visited = state.visited || {};
    if (!state.visited[s.id]) { state.visited[s.id] = true; persist(); }
    $app.innerHTML = "";
    if (!state.startedAt && s.id !== CONFIG.scenes[0].id) state.startedAt = state.startedAt || Date.now();
    switch (s.type) {
      case "title":
        renderTitle(s);
        break;
      case "chat":
        renderChat(s);
        break;
      case "puzzle":
        renderPuzzle(s);
        break;
      case "hub":
        renderHub(s);
        break;
      case "final":
        renderFinal(s);
        break;
      case "move":
        renderMove(s);
        break;
      case "code":
        renderCode(s);
        break;
      case "ending":
        renderEnding(s);
        break;
      default:
        $app.appendChild(el("p", null, ["未対応のシーン種別です: " + s.type]));
    }
    // 一度だけ出すお知らせ(QRコードを早く読みすぎたときなど)は、どの画面でも最上部に出す
    if (pendingNotice) {
      $app.insertBefore(el("div", { class: "notice-box", style: "margin-top:16px;" }, [pendingNotice]), $app.firstChild);
      pendingNotice = null;
    }
    updateDestBar();
    updateBottomBar();
  }

  function renderTitle(s) {
    const wrap = el("div", { class: "title-wrap" }, [
      el("h1", null, [s.heading, s.headingSub ? el("span", { class: "h1-sub" }, [s.headingSub]) : null]),
      el("div", { class: "sub" }, [s.sub]),
      el("div", { class: "lead" }, [s.lead]),
      el("button", { class: "btn", onclick: () => { state.startedAt = Date.now(); goto(s.next); } }, [s.buttonLabel]),
    ]);
    $app.appendChild(wrap);
  }

  // 依頼人とのやり取りは、地の文ではなくメッセージアプリふうのトーク画面で見せる。
  // from: "client"(依頼人・左/吹き出し) / "me"(自分・右/吹き出し) / "system"(中央の小さな通知)
  function renderChatMessage(m) {
    if (m.from === "system") {
      return el("div", { class: "chat-system-note" }, [m.text]);
    }
    const isMe = m.from === "me";
    return el("div", { class: "chat-row " + (isMe ? "chat-row-me" : "chat-row-client") }, [
      isMe ? null : el("div", { class: "chat-avatar" + (CONFIG.clientNameFont === "meiryo" ? " font-meiryo" : "") }, [CONFIG.clientAvatar || "依"]),
      el("div", { class: "chat-bubble " + (isMe ? "chat-bubble-me" : "chat-bubble-client") + (m.font === "meiryo" ? " font-meiryo" : "") }, [m.text]),
    ]);
  }

  function renderChat(s) {
    if (!state.storyLog.includes(s.id)) {
      state.storyLog.push(s.id);
      persist();
    }
    const messages = el("div", { class: "chat-messages" }, s.messages.map(renderChatMessage));
    const wrap = el("div", { class: "chat-wrap" }, [
      el("h2", null, [s.heading]),
      messages,
      el("button", { class: "btn btn-block", onclick: () => goto(s.next) }, ["次へ"]),
    ]);
    $app.appendChild(wrap);
  }

  function renderImageBlock(src, alt) {
    if (!src) return null;
    const img = el("img", { class: "puzzle-image-thumb", src, alt: alt || "", onclick: () => openLightbox(src, alt) });
    img.addEventListener("error", () => {
      img.replaceWith(el("div", { class: "puzzle-image-thumb", style: "display:flex;align-items:center;justify-content:center;color:#a08;font-size:12px;padding:30px 10px;" }, [
        "(画像未設置: " + src + ")",
      ]));
    });
    const cap = el("div", { class: "puzzle-image-caption" }, ["タップで拡大表示"]);
    const frag = document.createDocumentFragment();
    frag.appendChild(img);
    frag.appendChild(cap);
    return frag;
  }

  // 1つの謎で複数の画像を見せる場合は images: [{ src, alt }, ...] で渡せる(看板謎など)。
  // images が無ければ従来どおり image / imageAlt の1枚だけを表示する。
  function renderSceneImages(s) {
    const list = s.images && s.images.length ? s.images : s.image ? [{ src: s.image, alt: s.imageAlt }] : [];
    if (!list.length) return null;
    const frag = document.createDocumentFragment();
    list.forEach((im) => frag.appendChild(renderImageBlock(im.src, im.alt)));
    return frag;
  }

  function renderHintSection(s) {
    const opened = state.hintsOpened[s.id] || 0;
    const section = el("div", { class: "hint-section" }, []);
    section.appendChild(el("h3", null, ["段階ヒント"]));
    for (let i = 0; i < opened; i++) {
      const isLast = i === s.hints.length - 1;
      section.appendChild(
        el("div", { class: "hint-item" + (isLast ? " answer" : "") }, [
          el("span", { class: "hint-badge" }, [isLast ? "答え" : "ヒント" + (i + 1)]),
          s.hints[i],
        ])
      );
    }
    if (opened < s.hints.length) {
      const isNextLast = opened === s.hints.length - 1;
      section.appendChild(
        el("button", { class: "btn btn-ghost btn-block", id: "hint-open-btn", onclick: () => {
          state.hintsOpened[s.id] = opened + 1;
          persist();
          render();
          document.getElementById("btn-hint")?.scrollIntoView?.({ block: "nearest" });
        } }, [isNextLast ? "答えを見る" : "次のヒントを見る (" + (opened + 1) + "/" + s.hints.length + ")"])
      );
    }
    return section;
  }

  function renderRescueBox(s) {
    const count = state.wrongCount[s.id] || 0;
    if (count < WRONG_RESCUE_THRESHOLD) return null;
    return el("div", { class: "rescue-box" }, [
      "同じ謎で何度か外れているようです。ヒントを開いてみませんか？",
      el("br"),
      el("button", { class: "btn btn-secondary", onclick: () => {
        const opened = state.hintsOpened[s.id] || 0;
        if (opened < s.hints.length) {
          state.hintsOpened[s.id] = opened + 1;
          persist();
        }
        render();
      } }, ["ヒントを見る"]),
    ]);
  }

  function buildAnswerArea(s, onCorrect) {
    const wrap = el("div", null, []);
    const feedback = el("div", { class: "feedback" }, [""]);
    const input = el("input", {
      type: s.inputMode === "numeric" ? "tel" : "text",
      inputmode: s.inputMode === "numeric" ? "numeric" : "text",
      pattern: s.inputMode === "numeric" ? "[0-9]*" : undefined,
      maxlength: String(s.maxLength || 30),
      placeholder: s.inputMode === "numeric" ? "数字を入力" : "答えを入力",
      "aria-label": "答えの入力欄",
    });
    const submit = () => {
      if (matchAny(input.value, s.answers)) {
        feedback.textContent = "正解！";
        feedback.className = "feedback ok";
        markSolved(s.id);
        onCorrect();
      } else {
        feedback.textContent = s.wrongMessage || "残念、違うようです。";
        feedback.className = "feedback ng";
        state.wrongCount[s.id] = (state.wrongCount[s.id] || 0) + 1;
        persist();
        renderRescueSlot();
      }
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submit();
    });
    const row = el("div", { class: "answer-row" }, [
      input,
      el("button", { class: "btn", onclick: submit }, ["解答する"]),
    ]);
    wrap.appendChild(row);
    wrap.appendChild(feedback);
    const rescueSlot = el("div", null, []);
    wrap.appendChild(rescueSlot);
    function renderRescueSlot() {
      rescueSlot.innerHTML = "";
      const box = renderRescueBox(s);
      if (box) rescueSlot.appendChild(box);
    }
    renderRescueSlot();
    return wrap;
  }

  // 謎1(パソコンのパスワード)専用: PCのロック画面ふうの見た目。
  // 実際の入力・答え合わせは通常どおりbuildAnswerAreaのinputで行い、
  // このロック画面のドットは、その入力値をそのまま反映するだけの飾り。
  function renderLockScreen(maxLength) {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    const weekday = ["日", "月", "火", "水", "木", "金", "土"][now.getDay()];
    const dateStr = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日(" + weekday + ")";
    const lockIcon = el("div", { class: "lock-icon", html:
      '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
    }, []);
    const dots = [];
    const dotsRow = el("div", { class: "lock-dots" }, Array.from({ length: maxLength }, () => {
      const d = el("span", { class: "lock-dot" }, []);
      dots.push(d);
      return d;
    }));
    const screen = el("div", { class: "lock-screen" }, [
      el("div", { class: "lock-time" }, [hh + ":" + mm]),
      el("div", { class: "lock-date" }, [dateStr]),
      lockIcon,
      el("div", { class: "lock-label" }, ["パスコードを入力してください"]),
      dotsRow,
    ]);
    function updateDots(value) {
      const len = (value || "").length;
      dots.forEach((d, i) => d.classList.toggle("filled", i < len));
    }
    return { screen, updateDots };
  }

  function renderPuzzle(s) {
    const card = el("div", { class: "puzzle-card" }, []);
    card.appendChild(
      el("h2", { class: "puzzle-title" }, [
        s.heading,
        s.optional ? el("span", { class: "puzzle-optional-badge" }, ["任意"]) : null,
      ])
    );
    let lockScreenApi = null;
    if (s.lockScreen) {
      lockScreenApi = renderLockScreen(s.maxLength || 4);
      card.appendChild(lockScreenApi.screen);
    }
    // lockScreen(ロック画面の飾り)はあくまで演出。謎を解くための画像自体は
    // lockScreenの有無にかかわらず必ず表示する(でないと問題文の図が見えなくなる)。
    const imgBlock = renderSceneImages(s);
    if (imgBlock) card.appendChild(imgBlock);
    // 問題文が空の謎(画像だけで伝わるマップ謎など)は、問題文の段落自体を出さない
    if (s.prompt) card.appendChild(el("p", { class: "puzzle-prompt" + (s.font === "meiryo" ? " font-meiryo" : "") }, [s.prompt]));

    if (state.solved[s.id]) {
      if (lockScreenApi) lockScreenApi.updateDots("0".repeat(s.maxLength || 4));
      card.appendChild(el("div", { class: "feedback ok" }, ["この謎はすでに正解しています。"]));
      if (s.qrGate && resolveNext(s) === s.id) {
        // QRコードの先の謎がまだなら、読み込み欄を出す。日記などはボタンで読み返せる
        card.appendChild(renderQrGate(s));
        card.appendChild(el("button", { class: "btn btn-secondary btn-block", style: "margin-top:12px;", onclick: () => afterSolve(s) }, ["日記を読み返す"]));
      } else {
        card.appendChild(el("button", { class: "btn btn-block", onclick: () => afterSolve(s) }, ["次へ進む"]));
      }
    } else {
      const answerArea = buildAnswerArea(s, () => { afterSolve(s); });
      if (lockScreenApi) {
        const input = answerArea.querySelector("input");
        input.addEventListener("input", () => lockScreenApi.updateDots(input.value));
      }
      card.appendChild(answerArea);
      // 並列の謎: この謎を解く前でも、QRコードを読み込んで先に別の謎へ行ける(QRの謎が未解決のときだけ)
      if (s.qrGate && !state.solved[s.qrGate.target]) card.appendChild(renderQrGate(s));
      if (s.optional) {
        card.appendChild(
          el("div", { class: "skip-row" }, [
            el("button", { onclick: () => goto(s.next) }, ["この謎は解かずに次へ進む"]),
          ])
        );
      }
    }
    card.appendChild(renderHintSection(s));
    // 並列の謎: 未解決の仲間の謎へ移れるリンク(QRを読む前の謎は、関門の画面へのリンクになる)
    if (s.parallel && !state.solved[s.id]) {
      s.parallel.filter((id) => id !== s.id && !state.solved[id]).forEach((id) => {
        const gate = CONFIG.scenes.find((sc) => sc.qrGate && sc.qrGate.target === id);
        const dest = gate && !state.solved[gate.id + ":qr"] ? gate.id : id;
        if (dest === s.id) return; // 自分の画面のQR欄から行ける場合はリンク不要
        card.appendChild(el("div", { class: "skip-row" }, [
          el("button", { onclick: () => goto(dest) }, ["← 先に「" + scene(dest).heading + "」を解く"]),
        ]));
      });
    }
    // 出戻り先(next)がハブ画面(順不同で解ける謎の一覧)なら、解かずにいつでも一覧へ戻れるようにする
    if (scene(s.next) && scene(s.next).type === "hub") {
      card.appendChild(
        el("div", { class: "skip-row" }, [
          el("button", { onclick: () => goto(s.next) }, ["← 謎の一覧に戻る"]),
        ])
      );
    }
    $app.appendChild(card);
  }

  function renderHub(s) {
    const solvedIds = s.puzzles.filter((id) => state.solved[id]);
    const allSolved = solvedIds.length === s.puzzles.length;
    // optionalPuzzles(任意の謎)もカードとして並べるが、「次へ進む」の条件には含めない
    const cardIds = s.puzzles.concat(s.optionalPuzzles || []);
    const grid = el("div", { class: "hub-grid" }, cardIds.map((id) => {
      const p = scene(id);
      const isSolved = !!state.solved[id];
      return el("button", { class: "hub-card" + (isSolved ? " solved" : ""), onclick: () => goto(id) }, [
        // 番号の代わりに謎の画像を縮小して載せ、どの謎か見てわかるようにする
        p && p.image ? el("img", { class: "hub-thumb", src: p.image, alt: p.imageAlt || "", loading: "lazy" }) : null,
        el("div", { class: "hub-status" }, [isSolved ? "解決済み" : "未解決", p && p.optional ? el("span", { class: "puzzle-optional-badge" }, ["任意"]) : null]),
      ]);
    }));
    const wrap = el("div", { class: "hub-wrap" }, [
      el("h2", null, [s.heading]),
      s.body ? el("div", { class: "hub-intro" }, [s.body]) : null,
      grid,
      el("div", { class: "hub-progress" }, [solvedIds.length + " / " + s.puzzles.length + " 解決"]),
      allSolved
        ? el("button", { class: "btn btn-block", onclick: () => {
            if (s.reward && !state.solved[s.id]) {
              addClue(s.reward, s.heading);
              markSolved(s.id);
            }
            goto(s.next);
          } }, ["次へ進む"])
        : null,
    ]);
    $app.appendChild(wrap);
  }

  function afterSolve(s) {
    if (s.reward) addClue(s.reward, s.heading);
    if (s.lionSpecial) {
      showLionReveal(s);
      return;
    }
    if (s.diaryReveal) {
      showDiaryReveal(s);
      return;
    }
    goto(resolveNext(s));
  }

  /* ---------- 並列の謎(parallel) ----------
   * parallel に並べた謎はどの順番でも解ける。解き終えたら、まだ解いていない仲間の謎へ、
   * 全部解けていれば parallelNext へ進む。
   * 仲間の謎が QRコードの関門(qrGate)の先にあり、まだQRを読んでいない場合は、関門の画面へ戻す。
   */
  function resolveNext(s) {
    if (!s.parallel) return s.next;
    const rest = s.parallel.filter((id) => id !== s.id && !state.solved[id]);
    if (!rest.length) return s.parallelNext || s.next;
    const id = rest[0];
    const gate = CONFIG.scenes.find((sc) => sc.qrGate && sc.qrGate.target === id);
    if (gate && !state.solved[gate.id + ":qr"]) return gate.id;
    return id;
  }

  /* ---------- 日記の場面専用の縦書き表示 ----------
   * 作中で唯一Aさん本人の声が直接出てくる場面だけを縦書きにする。
   * 縦書き(vertical-rl)は右から左に読むため、開いた瞬間に右端(＝1行目)が
   * 見えている状態にしておく必要がある(でないと1行目が画面外になる)。
   * 読みづらい参加者のために「横書きで読む」トグルも必ず付ける(状態は保存しない)。
   */
  function showDiaryReveal(s) {
    const d = s.diaryReveal;
    $app.innerHTML = "";
    let vertical = true;
    const box = el("div", { class: "diary-box" }, d.vertical.map((line) => el("p", null, [line])));
    const toggleBtn = el("button", { class: "btn-secondary btn diary-toggle", type: "button" }, ["横書きで読む"]);
    function applyMode() {
      box.classList.toggle("diary-box-horizontal", !vertical);
      toggleBtn.textContent = vertical ? "横書きで読む" : "縦書きで読む";
      if (vertical) {
        // 縦書きは右端が1行目。レイアウト確定後にスクロール位置を右端(最大値)へ。
        requestAnimationFrame(() => { box.scrollLeft = box.scrollWidth; });
      }
    }
    toggleBtn.addEventListener("click", () => {
      vertical = !vertical;
      applyMode();
    });
    const wrap = el("div", { class: "story-wrap diary-wrap" }, [
      el("h2", null, [s.heading]),
      el("div", { class: "story-body" }, [el("p", null, [d.before])]),
      box,
      el("div", { class: "diary-toggle-row" }, [toggleBtn]),
      el("div", { class: "story-body" }, [el("p", null, [d.after])]),
      // qrGate のある謎は、日記を読んだあと元の画面(QRコードの読み込み欄)へ戻る
      // 行き先が自分自身(=QRコードをまだ読んでいない)なら、この謎の画面(QRの読み込み欄)に戻す
      el("button", { class: "btn btn-block", onclick: () => {
        const target = resolveNext(s);
        if (target === s.id) { render(); const g = document.querySelector(".qr-gate"); if (g) g.scrollIntoView({ block: "center" }); }
        else goto(target);
      } }, ["次へ"]),
    ]);
    $app.appendChild(wrap);
    applyMode();
  }

  /* ---------- LION謎専用の反転演出 ----------
   * 「先に答えを見せる実装に変えない」— 解答欄は左上に目印のある通常の
   * ブラケット、正解後の指示文は同じブラケットを180度回転させたものを
   * 使う。回転させるだけで目印が右下に移り、文字も反転して見える。
   * 参加者自身が「向きが逆だ」と気づいて読み解く体験を壊さないこと。
   */
  function showLionReveal(s) {
    $app.innerHTML = "";
    const wrap = el("div", { class: "lion-reveal-wrap" }, [
      el("div", { class: "lead-text" }, ["問題の答えは、この解答欄に書き込まれた——"]),
      el("div", { class: "bracket-box" }, ["LION"]),
      el("div", { class: "lead-text", style: "margin-top:26px;" }, [s.revealLead || "そして、依頼人からのメモにはこう記されていた。"]),
      el("div", null, [
        "真相は",
        el("span", { class: "bracket-box rotated" }, ["LION"]),
        "にある。",
      ]),
      el("button", { class: "btn btn-block", style: "margin-top:30px;", onclick: () => {
        addClue(s.revealClue || { label: "ポスターの指示文を入手" }, s.heading);
        goto(s.next);
      } }, ["次へ進む"]),
    ]);
    $app.appendChild(wrap);
  }

  function renderMove(s) {
    if (s.emphasis) {
      // 指示文を強調する移動シーン: 画面の中央に指示文だけを大きく置く
      $app.appendChild(el("div", { class: "move-emphasis" }, [
        el("div", { class: "move-emphasis-label" }, [s.heading]),
        el("p", { class: "move-emphasis-text" }, [s.body]),
        s.subText ? el("p", { class: "move-emphasis-sub" }, [s.subText]) : null,
        el("button", { class: "btn btn-block", onclick: () => goto(s.next) }, [s.buttonLabel || "次へ"]),
      ]));
      return;
    }
    const wrap = el("div", { class: "move-wrap" }, [
      el("div", { class: "move-icon" }, [s.icon || "🚶"]),
      el("h2", null, [s.heading]),
      el("p", null, [s.body]),
      s.destination ? el("div", { class: "move-dest" }, [
        el("div", { class: "l" }, ["目的地"]),
        el("div", { class: "v" }, [s.destination]),
      ]) : null,
      s.arrivalCodes && !state.solved[s.id]
        ? renderArrivalCheck(s)
        : el("button", { class: "btn btn-block", onclick: () => goto(s.next) }, [s.arrivalCodes ? "到着確認済み(次へ)" : s.buttonLabel || "次へ"]),
    ]);
    $app.appendChild(wrap);
  }

  // 現地に着いたことを、現地で伝えられる合言葉の入力で確認する(移動シーン用)。
  // 一度確認できたら state.solved に記録し、戻ってきても再入力はいらない(解いた謎の数には数えない)。
  function renderArrivalCheck(s) {
    const feedback = el("div", { class: "feedback" }, [""]);
    const input = el("input", { type: "text", placeholder: s.arrivalLabel || "現地の合言葉", "aria-label": s.arrivalLabel || "現地の合言葉" });
    const submit = () => {
      if (matchAny(input.value, s.arrivalCodes)) {
        state.solved[s.id] = true;
        persist();
        goto(s.next);
      } else {
        feedback.textContent = "合言葉が違うようです。現地でもう一度確かめてください。";
        feedback.className = "feedback ng";
      }
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    return el("div", { class: "arrival-check" }, [
      el("div", { class: "arrival-label" }, [s.arrivalLabel || "現地の合言葉"]),
      el("div", { class: "answer-row" }, [input, el("button", { class: "btn", onclick: submit }, ["確認する"])]),
      feedback,
    ]);
  }

  function renderCode(s) {
    const feedback = el("div", { class: "feedback" }, [""]);
    const input = el("input", { type: "text", placeholder: s.codeInputLabel || "合言葉", "aria-label": "合言葉の入力欄" });
    const submit = () => {
      const n = norm(input.value);
      let hit = null;
      for (const key in CONFIG.branchCodes) {
        if (norm(CONFIG.branchCodes[key].match) === n) {
          hit = key;
          break;
        }
      }
      if (hit) {
        const truth = CONFIG.branchCodes[hit].truth;
        state.truth = truth;
        state.branchChoice = hit;
        feedback.textContent = "合言葉を確認しました。";
        feedback.className = "feedback ok";
        persist();
        // nextTrue / nextNormal があれば、真相ルートかどうかで行き先を変える(無ければ next)
        goto((truth ? s.nextTrue : s.nextNormal) || s.next);
      } else {
        feedback.textContent = "その合言葉は登録されていません。";
        feedback.className = "feedback ng";
      }
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    const card = el("div", { class: "puzzle-card" }, [
      el("h2", { class: "puzzle-title" }, [s.heading]),
      el("p", { class: "puzzle-prompt" }, [s.body]),
      el("div", { class: "answer-row" }, [input, el("button", { class: "btn", onclick: submit }, ["入力する"])]),
      feedback,
    ]);
    const passRow = el("div", { class: "code-pass" }, [
      el("button", { onclick: () => {
        state.truth = false;
        state.branchChoice = "pass";
        persist();
        goto(s.nextNormal || s.next);
      } }, [s.passLabel || "どこにも辿り着けなかった"]),
    ]);
    const wrap = el("div", { class: "code-wrap" }, [card, passRow]);
    $app.appendChild(wrap);
  }

  function renderFinal(s) {
    const card = el("div", { class: "puzzle-card" }, []);
    card.appendChild(el("h2", { class: "puzzle-title" }, [s.heading]));
    const imgBlock = renderSceneImages(s);
    if (imgBlock) card.appendChild(imgBlock);
    card.appendChild(el("p", { class: "puzzle-prompt" }, [s.prompt]));
    card.appendChild(
      el("button", { class: "btn btn-secondary btn-block", style: "margin-bottom:14px;", onclick: openClueSheet }, [
        "手がかり一覧を見る(情報を総合する)",
      ])
    );
    const answerArea = s.clearKeywords ? buildSendArea(s) : buildAnswerArea(s, () => {
      state.finishedAt = Date.now();
      persist();
      const target = state.truth ? s.nextTrue : s.nextNormal;
      goto(target);
    });
    card.appendChild(answerArea);
    card.appendChild(renderHintSection(s));
    $app.appendChild(card);
  }

  /* ---------- 最終: 場所を「送信」する入力欄 ----------
   * clearKeywords のどれかを含めばクリア。含まなければ確認を出し、
   * それでも送信したらバッドエンドへ(「もう一度考える」で入力に戻れる)。
   */
  function buildSendArea(s) {
    const wrap = el("div", null, []);
    const input = el("input", { type: "text", maxlength: String(s.maxLength || 30), placeholder: "場所を入力", "aria-label": "小岩さんに伝える場所" });
    const feedback = el("div", { class: "feedback" }, [""]);
    const confirmSlot = el("div", null, []);
    const finish = (target) => {
      state.finishedAt = Date.now();
      state.finalAnswer = input.value;
      persist();
      goto(target);
    };
    const submit = () => {
      const n = norm(input.value);
      confirmSlot.innerHTML = "";
      if (!n) {
        feedback.textContent = "場所を入力してください。";
        feedback.className = "feedback ng";
        return;
      }
      feedback.textContent = "";
      if (s.clearKeywords.some((k) => n.includes(norm(k)))) {
        markSolved(s.id);
        finish(s.nextClear);
        return;
      }
      state.wrongCount[s.id] = (state.wrongCount[s.id] || 0) + 1;
      persist();
      confirmSlot.appendChild(el("div", { class: "confirm-box" }, [
        el("p", null, [s.confirmMessage || "本当にここでいいですか？"]),
        el("div", { class: "confirm-actions" }, [
          el("button", { class: "btn btn-secondary", onclick: () => { confirmSlot.innerHTML = ""; input.focus(); } }, [s.confirmBackLabel || "もう一度考える"]),
          el("button", { class: "btn", onclick: () => finish(s.nextBad) }, [s.confirmSendLabel || "送信する"]),
        ]),
      ]));
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    wrap.appendChild(el("div", { class: "answer-row" }, [input, el("button", { class: "btn", onclick: submit }, [s.submitLabel || "送信する"])]));
    wrap.appendChild(feedback);
    wrap.appendChild(confirmSlot);
    return wrap;
  }

  /* ---------- QRコードでしか進めない関門(qrGate) ----------
   * QRコードの中身は「サイトのURL?qr=token」。
   *  ・スマホのカメラアプリで読んだ場合: ページが ?qr=token 付きで開き、起動時に handleQrParam() が処理する
   *  ・この画面の「カメラで読み込む」: BarcodeDetector が使える端末(主にAndroid)ならページ内で読み取る
   *  ・どちらも無理な場合: QRコードの下に印刷した token を手入力しても進める
   * 関門の謎を解く前に読み込まれた場合は、先に謎を解くよう案内する(順番を飛ばさせない)。
   */
  let pendingNotice = null; // 次に描画する謎の画面の上部に一度だけ出すお知らせ
  function findQrGate(token) {
    const n = norm(token);
    if (!n) return null;
    return CONFIG.scenes.find((sc) => sc.qrGate && norm(sc.qrGate.token) === n) || null;
  }
  function passQrGate(gateScene) {
    // 関門の謎を解く前でも読み込める(ファイルの謎とQRコードの謎は並列)。
    // ただしゲームがまだその段階に来ていない(関門の画面を一度も開いていない)場合は進ませない
    const required = gateScene.qrGate.availableAfter || gateScene.id;
    if (!state.visited || !state.visited[required]) {
      pendingNotice = "このQRコードは、まだ使えません。";
      render();
      return;
    }
    state.solved[gateScene.id + ":qr"] = true;
    persist();
    goto(gateScene.qrGate.target);
  }
  function extractQrToken(text) {
    // 読み取った中身がURLなら ?qr= の値を、そうでなければ中身そのものを token として扱う
    try {
      const u = new URL(text, location.href);
      const q = u.searchParams.get("qr");
      if (q) return q;
    } catch (e) {}
    return text;
  }
  function renderQrGate(s) {
    const g = s.qrGate;
    const feedback = el("div", { class: "feedback" }, [""]);
    const input = el("input", { type: "text", placeholder: "QRコードの下の英数字", "aria-label": "QRコードの下の英数字", autocapitalize: "off" });
    const tryToken = (raw) => {
      const hit = findQrGate(extractQrToken(raw));
      if (hit && hit.id === s.id) {
        passQrGate(s);
      } else {
        feedback.textContent = "このQRコードではないようです。";
        feedback.className = "feedback ng";
      }
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") tryToken(input.value); });
    const camBtn = el("button", { class: "btn btn-block", onclick: () => openQrScanner(tryToken, feedback) }, ["カメラで読み込む"]);
    return el("div", { class: "qr-gate" }, [
      el("div", { class: "qr-gate-title" }, [g.label || "QRコードを読み込む"]),
      camBtn,
      el("div", { class: "qr-gate-note" }, [(g.note || "") + (g.note ? "\n" : "") + "スマホのカメラアプリでQRコードを読み取っても進めます。"]),
      el("div", { class: "answer-row" }, [input, el("button", { class: "btn", onclick: () => tryToken(input.value) }, ["進む"])]),
      feedback,
    ]);
  }
  async function openQrScanner(onText, feedback) {
    if (!("BarcodeDetector" in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      feedback.textContent = "この端末ではページ内のカメラ読み取りが使えません。スマホのカメラアプリでQRコードを読み取るか、QRコードの下の英数字を入力してください。";
      feedback.className = "feedback ng";
      return;
    }
    let stream = null;
    let stopped = false;
    const video = el("video", { playsinline: "true", muted: "true", autoplay: "true" }, []);
    const close = () => {
      stopped = true;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      overlay.remove();
    };
    const overlay = el("div", { class: "qr-scanner" }, [
      video,
      el("div", { class: "qr-scanner-frame" }, []),
      el("div", { class: "qr-scanner-hint" }, ["QRコードを枠の中に映してください"]),
      el("button", { class: "qr-scanner-close", "aria-label": "閉じる", onclick: close }, ["×"]),
    ]);
    document.body.appendChild(overlay);
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      video.srcObject = stream;
      await video.play();
      const detector = new BarcodeDetector({ formats: ["qr_code"] });
      const tick = async () => {
        if (stopped) return;
        try {
          const codes = await detector.detect(video);
          if (codes && codes.length) {
            close();
            onText(codes[0].rawValue);
            return;
          }
        } catch (e) {}
        setTimeout(tick, 250);
      };
      tick();
    } catch (e) {
      close();
      feedback.textContent = "カメラを起動できませんでした。スマホのカメラアプリでQRコードを読み取るか、QRコードの下の英数字を入力してください。";
      feedback.className = "feedback ng";
    }
  }
  // スマホのカメラアプリで読んで ?qr=token 付きで開かれたとき。処理後は ?qr= をURLから消す
  function handleQrParam() {
    let token = null;
    try { token = new URLSearchParams(location.search).get("qr"); } catch (e) {}
    if (!token) return false;
    try { history.replaceState({ sceneId: state.sceneId }, "", location.pathname + location.hash); } catch (e) {}
    const gate = findQrGate(token);
    if (!gate) return false;
    passQrGate(gate);
    return true;
  }

  function formatDuration(ms) {
    if (!ms || ms < 0) return "—";
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const sec = totalSec % 60;
    return m + "分" + String(sec).padStart(2, "0") + "秒";
  }

  function renderEnding(s) {
    const duration = state.startedAt && state.finishedAt ? state.finishedAt - state.startedAt : null;
    const shareText =
      "脱出ゲーム「" + CONFIG.gameTitle + "」をクリアしました！\n" +
      "エンディング: " + s.badge + "\n" +
      "所要時間: " + formatDuration(duration) + "\n" +
      "解いた謎: " + (state.solvedCount || 0) + "問";

    const wrap = el("div", { class: "ending-wrap" }, [
      el("div", { class: "ending-badge" }, [s.badge]),
      el("h2", null, [s.heading]),
      el("div", { class: "body" }, s.body.map((p) => el("p", { style: "margin:0 0 18px;" }, [p]))),
      // エピローグ(解説)の場所への案内
      s.epilogue ? el("div", { class: "move-dest", style: "margin-bottom:22px;" }, [
        el("div", { class: "l" }, [s.epilogue.label || "解説の場所"]),
        el("div", { class: "v" }, [s.epilogue.place]),
        s.epilogue.note ? el("div", { class: "l", style: "margin-top:6px;" }, [s.epilogue.note]) : null,
      ]) : null,
      el("div", { class: "ending-stats" }, [
        "所要時間: " + formatDuration(duration),
        el("br"),
        "解いた謎: " + (state.solvedCount || 0) + "問",
      ]),
      el("div", { class: "share-area" }, [
        el("button", { class: "btn btn-block", onclick: () => shareResult(shareText) }, ["結果を共有する"]),
      ]),
    ]);
    $app.appendChild(wrap);
  }

  async function shareResult(text) {
    if (navigator.share) {
      try {
        await navigator.share({ text });
        return;
      } catch (e) {
        /* ユーザーがキャンセルした場合などはコピーにフォールバック */
      }
    }
    let copied = false;
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (e) {}
    }
    const area = document.querySelector(".share-area");
    if (!area) return;
    let box = area.querySelector(".copy-fallback");
    if (!box) {
      box = el("div", { class: "copy-fallback" }, []);
      area.appendChild(box);
    }
    box.innerHTML = "";
    box.appendChild(el("div", { style: "font-size:12px;margin-top:10px;" }, [copied ? "クリップボードにコピーしました。" : "下のテキストを長押しでコピーしてください。"]));
    const ta = el("textarea", { readonly: "true" }, []);
    ta.value = text;
    box.appendChild(ta);
    if (!copied) ta.focus();
    if (!copied) ta.select();
  }

  /* ============================================================
   * 手がかり一覧(下部シート)
   * ============================================================ */
  let sheetEls = null;
  function openClueSheet() {
    closeSheetIfOpen();
    pushOverlayHistory();
    const backdrop = el("div", { class: "sheet-backdrop", onclick: closeSheetIfOpen }, []);
    const list = el("div", { class: "sheet-body" }, []);
    if (!state.clues.length) {
      list.appendChild(el("div", { class: "empty-note" }, ["まだ手がかりはありません。謎を解くと、ここに記録されていきます。"]));
    } else {
      state.clues.forEach((c) => {
        const img = c.image ? el("img", { src: c.image, alt: c.label, onclick: () => openLightbox(c.image, c.label) }) : null;
        list.appendChild(
          el("div", { class: "clue-item" }, [
            el("div", { class: "clue-item-head" }, [
              el("div", { class: "clue-from" }, [c.from || ""]),
              el("span", { class: "clue-kind-badge clue-kind-" + (c.kind || "doc") }, [KIND_LABEL[c.kind] || KIND_LABEL.doc]),
            ]),
            el("div", { class: "clue-label" + (c.font === "meiryo" ? " font-meiryo" : "") }, [c.label]),
            c.detail ? el("div", { class: "clue-detail" + (c.font === "meiryo" ? " font-meiryo" : "") }, [c.detail]) : null,
            img,
          ])
        );
      });
    }
    const sheet = el("div", { class: "sheet" }, [
      el("div", { class: "sheet-header" }, [
        el("h3", null, ["手がかり一覧"]),
        el("button", { onclick: closeSheetIfOpen, "aria-label": "閉じる" }, ["×"]),
      ]),
      list,
    ]);
    document.body.appendChild(backdrop);
    document.body.appendChild(sheet);
    sheetEls = [backdrop, sheet];
  }
  function closeSheetIfOpen() {
    if (sheetEls) {
      sheetEls.forEach((n) => n.remove());
      sheetEls = null;
    }
  }
  document.getElementById("btn-clue").addEventListener("click", openClueSheet);

  /* ============================================================
   * 物語を振り返る(下部シート)
   * 通過した story シーンの本文を、いつでもタブを移動せずに読み返せるようにする。
   * ============================================================ */
  function openStorySheet() {
    closeSheetIfOpen();
    pushOverlayHistory();
    const backdrop = el("div", { class: "sheet-backdrop", onclick: closeSheetIfOpen }, []);
    const list = el("div", { class: "sheet-body" }, []);
    if (!state.storyLog.length) {
      list.appendChild(el("div", { class: "empty-note" }, ["まだ振り返れる物語はありません。"]));
    } else {
      state.storyLog.forEach((sceneId) => {
        const s = scene(sceneId);
        if (!s) return; // CONFIG編集でシーンが削除された場合の保険
        list.appendChild(
          el("div", { class: "story-log-item" }, [
            el("div", { class: "story-log-heading" }, [s.heading]),
            el("div", { class: "story-log-body chat-messages chat-messages-compact" }, s.messages.map(renderChatMessage)),
          ])
        );
      });
    }
    const sheet = el("div", { class: "sheet" }, [
      el("div", { class: "sheet-header" }, [
        el("h3", null, ["物語を振り返る"]),
        el("button", { onclick: closeSheetIfOpen, "aria-label": "閉じる" }, ["×"]),
      ]),
      list,
    ]);
    document.body.appendChild(backdrop);
    document.body.appendChild(sheet);
    sheetEls = [backdrop, sheet];
  }

  document.getElementById("btn-hint").addEventListener("click", () => {
    const s = scene(state.sceneId);
    const target = document.querySelector(".hint-section");
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  /* ============================================================
   * ライトボックス(画像拡大・ピンチズーム・ドラッグ)
   * ============================================================ */
  let lb = null;
  function openLightbox(src, alt) {
    closeLightbox();
    pushOverlayHistory();
    const isMap = src === CONFIG.mapImage;
    const img = el("img", { src, alt: alt || "" });
    const stage = el("div", { class: "lb-stage" }, [img]);
    const closeBtn = el("button", { class: "lb-close", "aria-label": "閉じる", onclick: closeLightbox }, ["×"]);
    const hintText = el("div", { class: "lb-hint" }, ["ピンチ/ホイール/ボタンで拡大縮小 ・ ドラッグで移動 ・ ダブルタップでリセット"]);
    const zoomOutBtn = el("button", { class: "lb-zoom lb-zoom-out", "aria-label": "縮小" }, ["－"]);
    const zoomInBtn = el("button", { class: "lb-zoom lb-zoom-in", "aria-label": "拡大" }, ["＋"]);
    const zoomControls = el("div", { class: "lb-zoom-controls" }, [zoomOutBtn, zoomInBtn]);
    const children = [stage, closeBtn, zoomControls, hintText];

    let trailToggle = null;
    if (isMap) {
      const markerLayer = el("div", { class: "lb-markers" }, []);
      stage.appendChild(markerLayer);
      let trailOn = true;
      trailToggle = el("button", { class: "lb-trail-toggle", type: "button" }, ["軌跡: ON"]);
      function renderMarkers() {
        markerLayer.innerHTML = "";
        markerLayer.classList.toggle("hidden", !trailOn);
        if (!trailOn) return;
        getVisitedGridCells().forEach((n) => {
          const r = gridCellRect(n);
          markerLayer.appendChild(
            el("div", {
              class: "lb-marker",
              style: "left:" + r.x * 100 + "%;top:" + r.y * 100 + "%;width:" + r.w * 100 + "%;height:" + r.h * 100 + "%;",
            }, [el("span", { class: "lb-marker-badge" }, [String(n)])])
          );
        });
      }
      trailToggle.addEventListener("click", () => {
        trailOn = !trailOn;
        trailToggle.textContent = "軌跡: " + (trailOn ? "ON" : "OFF");
        renderMarkers();
      });
      renderMarkers();
      children.push(trailToggle);
    }

    const box = el("div", { id: "lightbox" }, children);
    document.body.appendChild(box);
    lb = box;
    setupPinchZoom(box, stage, img, zoomInBtn, zoomOutBtn);
  }
  function closeLightbox() {
    if (lb) {
      lb.remove();
      lb = null;
    }
  }

  function setupPinchZoom(container, stage, img, zoomInBtn, zoomOutBtn) {
    let scale = 1, tx = 0, ty = 0;
    let lastTapTime = 0;
    const pointers = new Map();
    let pinchStartDist = 0, pinchStartScale = 1;
    let dragStart = null;
    const MIN_SCALE = 1, MAX_SCALE = 6;

    // 拡大縮小の計算式そのもの(zoomTo/pointermoveのピンチ距離計算)は一切変更していない。
    // 変えたのは「transformをかける対象」だけ(imgそのもの→img とマーカー層をまとめたstage)。
    // これによりマーカーも画像とまったく同じ座標系で拡大・パンされ、ズレが生じない。
    function apply() {
      stage.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
      stage.style.setProperty("--zoom-scale", String(scale)); // マーカーの線幅をズーム倍率の逆数で補正するため
    }
    function centerImage() {
      scale = 1; tx = 0; ty = 0;
      requestAnimationFrame(() => {
        const cw = container.clientWidth, ch = container.clientHeight;
        const iw = img.naturalWidth || cw, ih = img.naturalHeight || ch;
        const fitScale = Math.min(cw / iw, ch / ih);
        stage.style.width = iw * fitScale + "px";
        stage.style.height = ih * fitScale + "px";
        tx = (cw - iw * fitScale) / 2;
        ty = (ch - ih * fitScale) / 2;
        apply();
      });
    }
    if (img.complete) centerImage();
    else img.addEventListener("load", centerImage);

    // 指定した座標(コンテナ基準)の下にある画像の点を固定したまま、拡大率だけを変える。
    // マウスホイール・+/-ボタン・ピンチのいずれもこの1つの関数で拡大縮小する。
    function zoomTo(newScale, cx, cy) {
      newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
      if (cx == null) {
        cx = container.clientWidth / 2;
        cy = container.clientHeight / 2;
      }
      const imgX = (cx - tx) / scale;
      const imgY = (cy - ty) / scale;
      tx = cx - imgX * newScale;
      ty = cy - imgY * newScale;
      scale = newScale;
      apply();
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }
    function mid(a, b) {
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    container.addEventListener("pointerdown", (e) => {
      container.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const pts = [...pointers.values()];
        pinchStartDist = dist(pts[0], pts[1]);
        pinchStartScale = scale;
      } else if (pointers.size === 1) {
        dragStart = { x: e.clientX, y: e.clientY, tx, ty };
      }
    });
    container.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const pts = [...pointers.values()];
        const d = dist(pts[0], pts[1]);
        const rect = container.getBoundingClientRect();
        const c = mid(pts[0], pts[1]);
        if (pinchStartDist > 0) {
          zoomTo(pinchStartScale * (d / pinchStartDist), c.x - rect.left, c.y - rect.top);
        }
      } else if (pointers.size === 1 && dragStart) {
        tx = dragStart.tx + (e.clientX - dragStart.x);
        ty = dragStart.ty + (e.clientY - dragStart.y);
        apply();
      }
    });
    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size === 1) {
        const pt = [...pointers.values()][0];
        dragStart = { x: pt.x, y: pt.y, tx, ty };
      } else {
        dragStart = null;
      }
    }
    container.addEventListener("pointerup", endPointer);
    container.addEventListener("pointercancel", endPointer);

    container.addEventListener("pointerup", (e) => {
      if (pointers.size > 0) return;
      const now = Date.now();
      if (now - lastTapTime < 300) {
        if (scale > 1) {
          centerImage();
        } else {
          const rect = container.getBoundingClientRect();
          zoomTo(2.5, e.clientX - rect.left, e.clientY - rect.top);
        }
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
    });

    // マウスホイール/トラックパッドのスクロールで、カーソル位置を中心に拡大縮小(PC向け)
    container.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = container.getBoundingClientRect();
      const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
      zoomTo(scale * factor, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    // 画面下の +/- ボタン(タッチ・マウス両対応)
    if (zoomInBtn) zoomInBtn.addEventListener("click", () => zoomTo(scale * 1.4));
    if (zoomOutBtn) zoomOutBtn.addEventListener("click", () => zoomTo(scale / 1.4));
  }

  /* ============================================================
   * スタッフモード( #staff )
   * ============================================================ */
  function isStaffMode() {
    return location.hash === "#staff";
  }
  function renderStaffPanelIfNeeded() {
    const existing = document.getElementById("staffpanel");
    if (!isStaffMode()) {
      if (existing) existing.remove();
      updateBottomBar();
      return;
    }
    if (existing) existing.remove();
    const panel = buildStaffPanel();
    document.body.appendChild(panel);
    updateBottomBar();
  }
  function buildStaffPanel() {
    const panel = el("div", { id: "staffpanel" }, []);
    panel.appendChild(el("h2", null, ["STAFFモード"]));
    panel.appendChild(el("div", { class: "note" }, ["URLに #staff を付けると誰でも入れます(学園祭規模の簡易ガード)。参加者に案内しないこと。"]));

    // 現在地ジャンプ
    const jumpSection = el("section", null, [el("h3", null, ["シーンへジャンプ"])]);
    const select = el("select", null, CONFIG.scenes.map((s) => el("option", { value: s.id, selected: s.id === state.sceneId ? "true" : undefined }, [s.id + " (" + s.type + (s.heading ? " / " + s.heading : "") + ")"])));
    const jumpBtn = el("button", { class: "btn", onclick: () => { goto(select.value); renderStaffPanelIfNeeded(); } }, ["移動する"]);
    jumpSection.appendChild(el("div", { class: "staff-row" }, [select, jumpBtn]));
    panel.appendChild(jumpSection);

    // 謎の解答状態だけをリセット(デバッグ用。他の進捗・手がかりはそのまま)
    const resettableIds = CONFIG.scenes.filter((s) => s.answers || s.arrivalCodes || s.type === "hub").map((s) => s.id);
    const resetSelect = el("select", null, resettableIds.map((id) => {
      const s = scene(id);
      const label = id + (s.type === "puzzle" || s.type === "final" ? " (" + s.heading + ")" : s.type === "hub" ? " (ハブ)" : "") + (state.solved[id] ? " ✓解答済み" : "");
      return el("option", { value: id }, [label]);
    }));
    const puzzleResetSection = el("section", null, [
      el("h3", null, ["謎の解答状態をリセット(デバッグ用)"]),
      el("div", { class: "note" }, ["選んだ謎だけを「未解答」に戻します。現在地・他の謎の進捗・獲得済みの手がかりはそのまま残ります(ハブを選ぶと中の謎も全てリセットされます)。再度解くと手がかりが重複して増えることがあります。気になる場合は下の「進捗をリセットする」を使ってください。"]),
      el("div", { class: "staff-row" }, [
        resetSelect,
        el("button", { class: "btn", onclick: () => {
          const id = resetSelect.value;
          const s = scene(id);
          const idsToReset = [id];
          if (s && s.type === "hub") idsToReset.push(...s.puzzles, ...(s.optionalPuzzles || []));
          idsToReset.forEach((pid) => {
            if (state.solved[pid]) {
              delete state.solved[pid];
              // 到着確認は「解いた謎の数」に数えていないので、数は減らさない
              if (!(scene(pid) && scene(pid).arrivalCodes)) state.solvedCount = Math.max(0, (state.solvedCount || 0) - 1);
            }
            delete state.hintsOpened[pid];
            delete state.wrongCount[pid];
          });
          persist();
          if (idsToReset.includes(state.sceneId)) render();
          renderStaffPanelIfNeeded();
        } }, ["この謎をリセット"]),
      ]),
    ]);
    panel.appendChild(puzzleResetSection);

    // 答え一覧
    const ansSection = el("section", null, [el("h3", null, ["答え一覧"])]);
    const table = el("table", null, []);
    table.appendChild(el("tr", null, [el("th", null, ["謎"]), el("th", null, ["答え"]), el("th", null, ["合言葉/備考"])]));
    CONFIG.scenes.forEach((s) => {
      if (s.answers) {
        table.appendChild(el("tr", null, [
          el("td", null, [s.heading || s.id]),
          el("td", null, [s.answers.join(" / ")]),
          el("td", null, [""]),
        ]));
      }
      if (s.arrivalCodes) {
        table.appendChild(el("tr", null, [
          el("td", null, ["到着確認: " + (s.destination || s.heading)]),
          el("td", null, [s.arrivalCodes.join(" / ")]),
          el("td", null, ["現地で伝える合言葉"]),
        ]));
      }
      if (s.qrGate) {
        const url = location.origin + location.pathname + "?qr=" + encodeURIComponent(s.qrGate.token);
        table.appendChild(el("tr", null, [
          el("td", null, ["QRコード: " + s.heading + " → " + ((scene(s.qrGate.target) || {}).heading || s.qrGate.target)]),
          el("td", null, [s.qrGate.token]),
          el("td", null, ["QRの中身: " + url]),
        ]));
      }
      if (s.clearKeywords) {
        table.appendChild(el("tr", null, [
          el("td", null, [s.heading + "(クリア判定)"]),
          el("td", null, [s.clearKeywords.join(" / ")]),
          el("td", null, ["いずれかを含めばクリア。それ以外は確認後バッドエンド"]),
        ]));
      }
    });
    for (const key in CONFIG.branchCodes) {
      table.appendChild(el("tr", null, [
        el("td", null, ["分岐合言葉"]),
        el("td", null, [CONFIG.branchCodes[key].match]),
        el("td", null, [CONFIG.branchCodes[key].truth ? "NO17(真相)" : "ライオン(空振り)"]),
      ]));
    }
    ansSection.appendChild(table);
    panel.appendChild(ansSection);

    // 現在の全状態
    const stateSection = el("section", null, [el("h3", null, ["現在の全状態"])]);
    stateSection.appendChild(el("pre", null, [JSON.stringify(state, null, 2)]));
    panel.appendChild(stateSection);

    // リセット
    const resetSection = el("section", null, [el("h3", null, ["進捗リセット"])]);
    resetSection.appendChild(
      el("button", { class: "btn", style: "background:var(--stamp);", onclick: () => {
        if (confirm("進捗をリセットします。よろしいですか？")) {
          store.reset();
          state = defaultState();
          location.hash = "";
          goto(state.sceneId);
        }
      } }, ["進捗をリセットする"])
    );
    panel.appendChild(resetSection);

    const closeBtn = el("button", { class: "btn btn-ghost btn-block", onclick: () => { location.hash = ""; } }, ["STAFFモードを閉じる"]);
    panel.appendChild(closeBtn);
    return panel;
  }
  window.addEventListener("hashchange", renderStaffPanelIfNeeded);

  /* ---------- 初期描画 ---------- */
  // 「戻る」の起点となる履歴エントリを、今表示しているシーンで置き換えておく
  try {
    history.replaceState({ sceneId: state.sceneId }, "", location.pathname + location.search + location.hash);
  } catch (e) {}
  render();
  handleQrParam();
  renderStaffPanelIfNeeded();
})();
</script>
</body>
</html>
